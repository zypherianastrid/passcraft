[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passcraft"
version = "1.0.0"
description = "A lightweight password and passphrase CLI generator"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "zypherianastrid" }
]

[project.scripts]
passcraft = "passcraft.cli:main"
